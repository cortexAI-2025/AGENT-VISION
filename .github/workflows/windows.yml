name: Windows
on:
  push:
  pull_request:
jobs:
  windows:
    name: Capture réelle sur runner Windows (pas un ordinateur physique)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - name: Tests unitaires et PowerShell (script, parseurs, service)
        run: npx vitest run packages/local-agent packages/core
      - name: Capture Windows réelle (GDI/PrintWindow) sur le bureau du runner
        run: npm run test:windows
        shell: bash
      - name: Vérification du packaging
        run: |
          npm pack -w @agent-vision/local-agent --dry-run
          node packages/local-agent/dist/cli.js help
        shell: bash
