name: Android
on:
  push:
  pull_request:
jobs:
  build:
    name: Compilation, tests unitaires, lint, APK debug
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests unitaires
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Android Lint
        run: ./gradlew --no-daemon :app:lintDebug
      - name: APK debug
        run: ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: agent-vision-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/app/build/reports/lint-results-debug.html
            android/app/build/test-results/testDebugUnitTest/
